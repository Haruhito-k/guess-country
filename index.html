<style>
body { background: #000; color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; }
#diff-selector { display: flex; gap: 10px; margin-bottom: 10px; }
.diff-btn { font-size: 16px; padding: 8px 16px; background: #333; border: 2px solid #666; color: #fff; cursor: pointer; border-radius: 5px; font-weight: bold; }
.diff-btn.active { background: #f80; color: #000; border-color: #f80; }
#waku { position: relative; width: 800px; height: 500px; border: 4px solid #f80; overflow: hidden; background: #222; }
#map { position: absolute; width: 3000px; will-change: transform; left: 50%; top: 50%; display: none; }
#target-name { font-size: 28px; color: #f80; font-weight: bold; height: 40px; }
#setup-area { position: absolute; z-index: 100; background: rgba(0,0,0,0.9); width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.input-area { display: flex; align-items: center; gap: 10px; margin-top: 15px; }
input[type="text"] { font-size: 30px; padding: 10px; text-align: center; border: 2px solid #f80; background: #000; color: #fff; width: 350px; }
button.skip-btn { font-size: 20px; padding: 14px 20px; background: #555; border: 2px solid #888; color: #fff; font-weight: bold; cursor: pointer; border-radius: 5px; }
button.skip-btn:hover { background: #777; }
input[type="file"] { font-size: 18px; padding: 12px 24px; background: #f80; border: none; color: #000; font-weight: bold; cursor: pointer; border-radius: 5px; }
</style>
</head>

var activeCountries = [];

fileInput.onchange = function(e) {
  var files = e.target.files;
  for (var i = 0; i < files.length; i++) {
    var key = cleanName(files[i].name);
    fileMap[key] = files[i];
  }

  setupArea.style.display = 'none';
  m.style.display = 'block';
  b.disabled = false;
  skipBtn.disabled = false;
  
  filterCountries();

  setTimeout(function() {
    b.focus();
    nextQuestion();
  }, 100);
};

function setDifficulty(diff, btn) {
  currentDiff = diff;
  var btns = document.querySelectorAll('.diff-btn');
  btns.forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');

  if (Object.keys(fileMap).length > 0) {
    filterCountries();
    nextQuestion();
  }
}

function filterCountries() {
  activeCountries = masterCountries.filter(function(c) {
    var hasFile = fileMap[cleanName(c.file)] !== undefined;
    if (!hasFile) return false;
    if (currentDiff === 'all') return true;
    return c.diff === currentDiff;
  });

  if (activeCountries.length === 0) {
    alert("該当する難易度の画像が見つかりませんでした。「すべて」に戻します。");
    currentDiff = 'all';
    filterCountries();
  }
}

function skipQuestion() {
  if (!current) return;
  alert("スキップしました！正解は「" + current.name + "」");
  nextQuestion();
}

var lastUrl = null;

function nextQuestion() {
  if (timer) clearInterval(timer);
  if (activeCountries.length === 0) return;

  if (lastUrl) {
    URL.revokeObjectURL(lastUrl);
  }

  current = activeCountries[Math.floor(Math.random() * activeCountries.length)];
  
  var file = fileMap[cleanName(current.file)];
  lastUrl = URL.createObjectURL(file);
  
  m.src = lastUrl;
  s = 0.8;
  b.value = "";
  tText.innerText = "ターゲットを破壊せよ！！";
  update();

  timer = setInterval(function() {
    s = s + 0.012;
    update();
    if (s > 7) {
      alert("時間切れ！正解は「" + current.name + "」");
      nextQuestion();
    }
  }, 20);
}

function update() {
  if (!current) return;
  m.style.transformOrigin = current.x + "% " + current.y + "%";
  m.style.transform = "translate(-" + current.x + "%, -" + current.y + "%) scale(" + s + ")";
}

b.onkeypress = function(e) {
  if (e.keyCode === 13) {
    if (b.value.trim() === "") {
      skipQuestion();
      return;
    }

    if (b.value === current.name) {
      alert("成功！");
      nextQuestion();
    } else {
      b.value = "";
    }
  }
};
