<style>
body {
    background: #000;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: sans-serif;
}

#diff-selector {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

.diff-btn {
    font-size: 16px;
    padding: 8px 16px;
    background: #333;
    border: 2px solid #666;
    color: #fff;
    cursor: pointer;
    border-radius: 5px;
    font-weight: bold;
}

.diff-btn.active {
    background: #f80;
    color: #000;
    border-color: #f80;
}

#waku {
    position: relative;
    width: 800px;
    height: 500px;
    border: 4px solid #f80;
    overflow: hidden;
    background: #222;
}

#map {
    position: absolute;
    width: 3000px;
    max-width: none;
    will-change: transform;
    left: 50%;
    top: 50%;
    display: none;
    user-select: none;
    -webkit-user-drag: none;
}

#target-name {
    font-size: 28px;
    color: #f80;
    font-weight: bold;
    height: 40px;
}

.input-area {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 15px;
}

input[type="text"] {
    font-size: 30px;
    padding: 10px;
    text-align: center;
    border: 2px solid #f80;
    background: #000;
    color: #fff;
    width: 350px;
}

button.skip-btn {
    font-size: 20px;
    padding: 14px 20px;
    background: #555;
    border: 2px solid #888;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
}

button.skip-btn:hover {
    background: #777;
}

/* 画像読み込み中 */
#loading {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

#loading-text {
    font-size: 22px;
    color: #f80;
    font-weight: bold;
}

#loading-detail {
    margin-top: 10px;
    font-size: 15px;
    color: #aaa;
}

/* エラー表示 */
#error-message {
    display: none;
    color: #f55;
    max-width: 700px;
    text-align: center;
    line-height: 1.7;
    margin: 20px;
}

/* スマホ対応 */
@media (max-width: 850px) {
    #waku {
        width: 90vw;
        height: 56.25vw;
        max-height: 500px;
    }

    #target-name {
        font-size: 22px;
    }

    input[type="text"] {
        width: 55vw;
        font-size: 22px;
    }

    button.skip-btn {
        font-size: 16px;
        padding: 10px;
    }
}
</style>

</head>

/* =========================================================
   画像の拡張子を自動判定
========================================================= */

var imageExtensions = [
    ".png",
    ".jpg",
    ".jpeg",
    ".webp"
];


/* =========================================================
   画像URLを探す
========================================================= */

function findImage(country, callback) {

    var index = 0;

    function tryNext() {

        if (index >= imageExtensions.length) {

            callback(null);
            return;
        }

        var url =
            IMAGE_FOLDER +
            country.file +
            imageExtensions[index];

        index++;

        var img = new Image();

        img.onload = function() {
            callback(url);
        };

        img.onerror = function() {
            tryNext();
        };

        img.src = url;
    }

    tryNext();
}


/* =========================================================
   全画像を読み込む
========================================================= */

function loadImages() {

    loading.style.display = "flex";

    var loaded = 0;
    var failed = 0;

    var total = masterCountries.length;

    masterCountries.forEach(function(country) {

        findImage(country, function(url) {

            if (url) {

                country.url = url;
                loaded++;

            } else {

                failed++;
            }

            var finished = loaded + failed;

            loadingText.textContent =
                "画像を読み込んでいます... " +
                finished +
                " / " +
                total;

            if (finished === total) {

                finishLoading();
            }
        });

    });
}
