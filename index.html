<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guess Country</title>

<style>
body {
    background: #000;
    color: #fff;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: sans-serif;
}

#diff-selector {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

.diff-btn {
    font-size: 16px;
    padding: 8px 16px;
    background: #333;
    border: 2px solid #666;
    color: #fff;
    cursor: pointer;
    border-radius: 5px;
    font-weight: bold;
}

.diff-btn.active {
    background: #f80;
    color: #000;
    border-color: #f80;
}

#waku {
    position: relative;
    width: 800px;
    height: 500px;
    border: 4px solid #f80;
    overflow: hidden;
    background: #222;
}

#map {
    position: absolute;
    width: 3000px;
    max-width: none;
    will-change: transform;
    left: 50%;
    top: 50%;
    display: none;
    user-select: none;
    -webkit-user-drag: none;
}

#target-name {
    font-size: 28px;
    color: #f80;
    font-weight: bold;
    height: 40px;
}

.input-area {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 15px;
}

input[type="text"] {
    font-size: 30px;
    padding: 10px;
    text-align: center;
    border: 2px solid #f80;
    background: #000;
    color: #fff;
    width: 350px;
}

button.skip-btn {
    font-size: 20px;
    padding: 14px 20px;
    background: #555;
    border: 2px solid #888;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
}

button.skip-btn:hover {
    background: #777;
}

#loading {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

#loading-text {
    font-size: 22px;
    color: #f80;
    font-weight: bold;
    text-align: center;
}

#loading-detail {
    margin-top: 10px;
    font-size: 15px;
    color: #aaa;
    text-align: center;
    max-width: 90%;
}

#error-message {
    display: none;
    color: #f55;
    max-width: 700px;
    text-align: center;
    line-height: 1.7;
    margin: 20px;
}

@media (max-width: 850px) {

    #waku {
        width: 90vw;
        height: 56.25vw;
        max-height: 500px;
    }

    #target-name {
        font-size: 22px;
    }

    input[type="text"] {
        width: 55vw;
        font-size: 22px;
    }

    button.skip-btn {
        font-size: 16px;
        padding: 10px;
    }
}
</style>

</head>

<body>

<div id="diff-selector">
    <button class="diff-btn active" onclick="setDifficulty('all', this)">すべて</button>
    <button class="diff-btn" onclick="setDifficulty('easy', this)">かんたん</button>
    <button class="diff-btn" onclick="setDifficulty('normal', this)">ふつう</button>
    <button class="diff-btn" onclick="setDifficulty('hard', this)">むずかしい</button>
</div>

<div id="target-name">画像を読み込んでいます...</div>

<div id="waku">

    <div id="loading">
        <div id="loading-text">GitHubから画像を読み込んでいます...</div>
        <div id="loading-detail">
            少し待ってください
        </div>
    </div>

    <div id="error-message"></div>

    <img id="map" src="" alt="国の画像">

</div>

<div class="input-area">

    <input
        type="text"
        id="box"
        placeholder="国名を入力"
        disabled
        autocomplete="off"
    >

    <button
        class="skip-btn"
        id="skip-btn"
        onclick="skipQuestion()"
        disabled
    >
        パス (Enter)
    </button>

</div>

    { name: "ポーランド", file: "poland", x: 50.5, y: 19, diff: "hard" },

    { name: "マダガスカル", file: "madagascar", x: 59, y: 72, diff: "hard" },
    { name: "マレーシア", file: "malaysia", x: 78, y: 56, diff: "hard" },
    { name: "南アフリカ共和国", file: "southafrica", x: 53, y: 78.7, diff: "hard" },
    { name: "ミャンマー", file: "myanmar", x: 76, y: 45, diff: "hard" },
    { name: "モロッコ", file: "morocco", x: 43.5, y: 36, diff: "hard" },
    { name: "ヨルダン", file: "jordan", x: 56.3, y: 35.5, diff: "hard" },
    { name: "ルーマニア", file: "romania", x: 52.7, y: 25.2, diff: "hard" }
];

var activeCountries = [];


/* =========================================================
   ファイル名を比較するための関数
========================================================= */

function cleanName(name) {

    return name
        .toLowerCase()
        .replace(/\.[^/.]+$/, "")
        .replace(/_map|[-_]map/g, "")
        .replace(/[^a-z0-9]/g, "");
}


/* =========================================================
   GitHubのapploadedフォルダから画像一覧を取得
========================================================= */

async function loadImagesFromGitHub() {

    try {

        loadingText.textContent =
            "GitHubから画像を読み込んでいます...";

        loadingDetail.textContent =
            "画像ファイルを確認しています";


        var response = await fetch(GITHUB_API, {
            cache: "no-store"
        });


        if (!response.ok) {

            throw new Error(
                "GitHub API error: " +
                response.status
            );
        }


        var files = await response.json();


        if (!Array.isArray(files)) {

            throw new Error(
                "apploadedフォルダを読み込めませんでした"
            );
        }


        var imageFiles = files.filter(function(file) {

            if (file.type !== "file") {
                return false;
            }

            return /\.(png|jpg|jpeg|webp|gif)$/i.test(
                file.name
            );
        });


        if (imageFiles.length === 0) {

            throw new Error(
                "apploadedフォルダに画像がありません"
            );
        }


        var matched = 0;


        /*
         * GitHubに実際に存在するファイル名と
         * masterCountriesのfileを照合する
         */

        masterCountries.forEach(function(country) {

            var target = cleanName(country.file);


            var found = imageFiles.find(function(file) {

                return cleanName(file.name) === target;

            });


            if (found) {

                country.url =
                    GITHUB_RAW +
                    encodeURIComponent(found.name);

                country.actualFile =
                    found.name;

                matched++;

            }

        });


        loadingText.textContent =
            "画像の準備が完了しました";


        loadingDetail.textContent =
            matched +
            " / " +
            masterCountries.length +
            " 個の国の画像を確認しました";


        filterCountries();


        if (activeCountries.length === 0) {

            throw new Error(
                "国のデータと画像ファイルを対応させられませんでした。"
            );
        }


        /*
         * 最初の画像を先に読み込む
         */

        var first = activeCountries[0];

        await preloadImage(first.url);


        loading.style.display = "none";

        m.style.display = "block";

        b.disabled = false;
        skipBtn.disabled = false;

        tText.textContent =
            "ターゲットを破壊せよ！！";


        setTimeout(function() {

            b.focus();

            nextQuestion();

        }, 100);


    } catch (error) {

        console.error(error);


        loadingText.textContent =
            "画像の読み込みに失敗しました";


        loadingDetail.textContent =
            error.message;


        errorMessage.innerHTML =
            "GitHubから画像を読み込めませんでした。<br><br>" +
            "ページを再読み込みしてもう一度試してください。<br><br>" +
            "<small>" +
            error.message +
            "</small>";


        errorMessage.style.display = "block";
    }
}


/* =========================================================
   画像の読み込み確認
========================================================= */

function preloadImage(url) {

    return new Promise(function(resolve, reject) {

        var img = new Image();


        img.onload = function() {

            resolve();

        };


        img.onerror = function() {

            reject(
                new Error(
                    "画像を読み込めませんでした: " +
                    url
                )
            );

        };


        img.src = url;

    });
}


/* =========================================================
   難易度変更
========================================================= */

function setDifficulty(diff, btn) {

    currentDiff = diff;


    var btns =
        document.querySelectorAll(".diff-btn");


    btns.forEach(function(button) {

        button.classList.remove("active");

    });


    btn.classList.add("active");


    if (activeCountries.length > 0) {

        filterCountries();

        nextQuestion();

    }
}


/* =========================================================
   問題を難易度で絞り込む
========================================================= */

function filterCountries() {

    activeCountries =
        masterCountries.filter(function(country) {

            if (!country.url) {

                return false;

            }


            if (currentDiff === "all") {

                return true;

            }


            return country.diff === currentDiff;

        });


    /*
     * 選択した難易度に画像がない場合
     */

    if (
        activeCountries.length === 0 &&
        currentDiff !== "all"
    ) {

        alert(
            "この難易度の画像が見つかりませんでした。「すべて」に戻します。"
        );


        currentDiff = "all";


        document
            .querySelectorAll(".diff-btn")
            .forEach(function(button) {

                button.classList.remove("active");

            });


        document
            .querySelector(".diff-btn")
            .classList.add("active");


        filterCountries();

    }
}


/* =========================================================
   パス
========================================================= */

function skipQuestion() {

    if (!current) {

        return;

    }


    alert(
        "スキップしました！\n\n" +
        "正解は「" +
        current.name +
        "」"
    );


    nextQuestion();
}


/* =========================================================
   次の問題
========================================================= */

function nextQuestion() {

    if (timer) {

        clearInterval(timer);

        timer = null;

    }


    if (activeCountries.length === 0) {

        return;

    }


    current =
        activeCountries[
            Math.floor(
                Math.random() *
                activeCountries.length
            )
        ];


    m.src = current.url;


    s = 0.8;


    b.value = "";


    tText.textContent =
        "ターゲットを破壊せよ！！";


    update();


    timer = setInterval(function() {

        s += 0.012;


        update();


        if (s > 7) {

            clearInterval(timer);

            timer = null;


            alert(
                "時間切れ！\n\n" +
                "正解は「" +
                current.name +
                "」"
            );


            nextQuestion();

        }

    }, 20);
}


/* =========================================================
   画像位置更新
========================================================= */

function update() {

    if (!current) {

        return;

    }


    m.style.transformOrigin =
        current.x +
        "% " +
        current.y +
        "%";


    m.style.transform =
        "translate(-" +
        current.x +
        "%, -" +
        current.y +
        "%) scale(" +
        s +
        ")";
}


/* =========================================================
   Enterキー
========================================================= */

b.addEventListener("keydown", function(e) {

    if (e.key !== "Enter") {

        return;

    }


    if (!current) {

        return;

    }


    var answer =
        b.value.trim();


    /*
     * 空欄ならパス
     */

    if (answer === "") {

        skipQuestion();

        return;

    }


    /*
     * 正解
     */

    if (answer === current.name) {

        alert("成功！");


        nextQuestion();


        return;

    }


    /*
     * 不正解
     */

    b.value = "";

});


/* =========================================================
   ゲーム開始
========================================================= */

loadImagesFromGitHub();

</script>

</html>
